name: Build and Publish package
on:
  push:
    branches: [ CURE-Product-Master ]
  workflow_dispatch:

jobs:
  Trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Pre-populate Maven cache
        run: mvn dependency:resolve --no-transfer-progress -q || true
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "fs"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          trivyignores: ".trivyignore"
  build-publish-package:
    name: Build and Publish package
    runs-on: ubuntu-latest
    needs: Trivy
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Configure Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.CURE_EMR_ORG_ACCESS_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
      - name: Build and deploy with Maven
        run: mvn --no-transfer-progress clean -U deploy -DskipTests
      - name: Delete Existing Release and Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_name="Release-v2.5.0.ipd-SNAPSHOT.omod"
          tag_name="v2.5.0.ipd-SNAPSHOT.omod"

          release_id=$(curl -s -X GET -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases" | jq -r --arg release_name "$release_name" '.[] | select(.name == $release_name) | .id')

          if [ ! -z "$release_id" ] && [ "$release_id" != "null" ]; then
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/$release_id"
            echo "Deleted release $release_name"
          else
            echo "No release found for $release_name to delete."
          fi

          git push --delete origin $tag_name || echo "Tag $tag_name not found on remote."
      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v2.5.0.ipd-SNAPSHOT.omod
          release_name: Release-v2.5.0.ipd-SNAPSHOT.omod
          draft: false
          prerelease: false
      - name: Upload SNAPSHOT.omod to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: omod/target/fhir2-2.5.0.ipd-SNAPSHOT.omod
          asset_name: fhir2-2.5.0.ipd-SNAPSHOT.omod
          asset_content_type: application/octet-stream
